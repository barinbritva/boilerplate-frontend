pre-commit:
  parallel: false
  commands:
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs,mts,json,yml,yaml}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    lint-imports:
      glob: 'src/**/*.{js,jsx,ts,tsx,mjs,mts}'
      run: pnpm biome lint {staged_files}
pre-push:
  parallel: true
  commands:
    check-types:
      run: pnpm check-types
