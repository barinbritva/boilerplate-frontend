# Avoid unnecessary Git LFS SSH checks and repeated SSH-agent prompts; this repo has no LFS files.
skip_lfs: true

pre-commit:
  parallel: true
  commands:
    lint-format:
      glob: '{.prettierrc.json,**/*.{js,jsx,ts,tsx,mjs,mts,json}}'
      run: pnpm exec biome check --write {staged_files} && git add {staged_files}
    lint-format-yaml:
      glob: '**/*.{yml,yaml}'
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}
    lint-imports:
      glob: 'src/**/*.{js,jsx,ts,tsx,mjs,mts}'
      run: pnpm biome lint {staged_files}
pre-push:
  parallel: true
  commands:
    check-types:
      run: pnpm check-types
