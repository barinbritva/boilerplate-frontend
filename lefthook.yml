pre-commit:
  parallel: false
  commands:
    lint:
      glob: '*.{js,jsx,ts,tsx,json,yml,yaml}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    lint-imports:
      glob: 'src/**/*.{ts,tsx}'
      run: pnpm biome lint {staged_files}
pre-push:
  parallel: true
  commands:
    check-types:
      run: pnpm check-types
