# allow post-install script for following packages:
allowBuilds:
  esbuild: true
  lefthook: false
# 7 days in minutes
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - vite@8.2.0
  - mobx-react-lite@5.0.0
  - mobx@7.0.0
  - '@storybook/builder-vite@10.5.6'
  - '@storybook/csf-plugin@10.5.6'
  - '@storybook/react-dom-shim@10.5.6'
  - '@storybook/react-vite@10.5.6'
  - '@storybook/react@10.5.6'
  - storybook@10.5.6
# Install exact versions, no ^ or ~ prefix
savePrefix: ''
