# allow post-install script for following packages:
allowBuilds:
  lefthook: false
# 7 days in minutes
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - vite@8.2.0
  - mobx-react-lite@5.0.0
  - mobx@7.0.0
# Install exact versions, no ^ or ~ prefix
savePrefix: ''
